// 화면에서 쓰는 호출 창구: api("GET", "/api/todos?sort=priority")
async function api(method, path, body, headers = {}){
  const url = new URL(path, "http://local"), p = url.pathname.replace(/^\/api/, "") || "/";
  for (const [m, rx, fn] of ROUTES){
    const match = rx.exec(p);
    if (m !== method || !match) continue;
    return fn({ query: url.searchParams, body: body || {}, headers }, ...match.slice(1));
  }
  throw new Error("없는 주소입니다.");
}

  }
  if (r.weeks.length) v.append(h("div", { class: "card" }, h("h2", {}, "주별 합계 (주 시작: " + r.rules.week_start + ")"),
    h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, ["주 시작일", "기록한 날", "합계"].map(t => h("th", {}, t)))),
      h("tbody", {}, r.weeks.map(w => h("tr", {}, h("td", {}, w.week_start), h("td", {}, w.days + "일"), h("td", {}, w.sum + " " + u))))))));
}

/* ============ 내 계정 ============ */
function downloadJson(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
}
async function viewAccount(v){
  v.append(h("div", { class: "card" }, h("h2", {}, "내 계정"), h("p", {}, "로그인한 이메일: ", h("b", {}, S.email)),
    h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => guard(async () => { await signOutNow(); showAuth("로그아웃했습니다."); }) }, "로그아웃"))));

  v.append(h("div", { class: "card" }, h("h2", {}, "내 자료 내보내기"),
    h("p", { class: "muted small" }, "내 계획·할 일·실행 기록·5일 기록을 파일 하나(JSON)로 내려받습니다. 다른 사람의 자료는 들어 있지 않습니다."),
    h("button", { class: "btn", type: "button", onclick: () => guard(async () => downloadJson("plan-do-see-diary-" + todayKst() + ".json", await exportData())) }, "내 자료 내려받기")));

  const file = h("input", { type: "file", accept: ".json,application/json" }), out = h("p", { class: "small" });
  const impBtn = h("button", { class: "btn", type: "button", onclick: () => guard(async () => {
      const fl = file.files[0];
      if (!fl) throw new Error("6번에서 내보낸 파일을 먼저 고르세요.");
      if (fl.size > 5 * 1024 * 1024) throw new Error("파일이 너무 큽니다(5MB 이하).");
      let data;
      try { data = JSON.parse(await fl.text()); } catch { throw new Error("JSON 파일이 아닙니다."); }
      const c = k => Array.isArray(data[k]) ? data[k].length : 0;
      if (!confirm("계획 " + c("plans") + "개, 할 일 " + c("todos") + "개, 실행 기록 " + c("exec_logs") + "개를 내 계정으로 가져옵니다. 이미 가져온 파일이면 중복되니 한 번만 하세요. 진행할까요?")) return;
      impBtn.disabled = true;
      try { const r = await importT06(data); out.textContent = "가져왔습니다: 계획 " + r.plans + "개 · 할 일 " + r.todos + "개 · 실행 기록 " + r.exec_logs + "개"; out.className = "small ok"; file.value = ""; }
      finally { impBtn.disabled = false; }
    }) }, "내 계정으로 가져오기");
  v.append(h("div", { class: "card" }, h("h2", {}, "6번 다이어리 자료 가져오기"),
    h("p", { class: "muted small" }, "6번 앱에서 '내 자료 내보내기'로 받은 파일을 골라 내 계정으로 옮깁니다. 번호(ID)는 새로 매겨집니다."), file,
    h("div", { class: "row", style: "margin-top:8px" }, impBtn), out));

  const typed = h("input", { placeholder: "삭제", style: "max-width:140px" });
  const delBtn = h("button", { class: "btn danger", type: "button", disabled: true, onclick: () => guard(async () => {
      if (!confirm("정말 계정을 삭제할까요? 내 자료도 함께 영구 삭제되고 되돌릴 수 없습니다.")) return;
      delBtn.disabled = true;
      await deleteAccount(); authMode = "login"; showAuth("계정과 내 자료를 삭제했습니다.");
    }) }, "계정과 내 자료 삭제");
  typed.oninput = () => { delBtn.disabled = typed.value.trim() !== "삭제"; };
  v.append(h("div", { class: "card" }, h("h2", {}, "계정 삭제"),
    h("p", { class: "small" }, "계정을 삭제하면 내 계획·할 일·실행 기록·5일 기록이 ", h("b", {}, "함께 영구 삭제"), "됩니다. 되돌릴 수 없습니다."),
    h("div", { class: "row" }, h("span", { class: "small" }, "확인을 위해 '삭제'라고 입력:"), typed, delBtn)));
}

$("#logoutBtn").onclick = () => guard(async () => { await signOutNow(); showAuth("로그아웃했습니다."); });
try { client().auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT" && S.signedIn) showAuth("로그아웃되었습니다."); }); } catch (e) { /* 설정 전에는 go() 가 안내를 띄운다 */ }

/* ============ 시작 ============ */
S.tab = (location.hash || "#plan").slice(1);
if (!TABS.some(t => t[0] === S.tab)) S.tab = "plan";
go(S.tab);
</script>
</body>
