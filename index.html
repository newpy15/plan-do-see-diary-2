<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.supabase.co; img-src data:; base-uri 'none'; form-action 'none'">
<title>플랜두씨 다이어리</title>
<style>
:root{
  --bg:#f3f7f7; --card:#fff; --ink:#1e2b31; --muted:#5a6a72; --line:#d5e0e2;
  --teal:#1d7a7a; --teal-soft:#e6f3f3; --blue:#3b6ea5; --green:#2f8f5b; --orange:#c2742a; --purple:#7b5ea7;
  --red:#b3382c; --red-soft:#fbeceb; --warn-soft:#fff6e5; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141b1e; --card:#1c262a; --ink:#e4ecee; --muted:#9bb0b6; --line:#32444a;
    --teal:#4fc1c1; --teal-soft:#1b3436; --blue:#79a8dc; --green:#5fc48c; --orange:#e3a15f; --purple:#b19bd6;
    --red:#ff8a7d; --red-soft:#3a1f1c; --warn-soft:#3a3118; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.badge{font-size:12px;background:var(--teal-soft);color:var(--teal);border-radius:99px;padding:3px 12px;white-space:nowrap}
h1{font-size:24px;line-height:1.3;margin:6px 0 4px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 8px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice{border:1px solid var(--orange);background:var(--warn-soft);border-radius:var(--radius);padding:10px 14px;margin:14px 0;font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 16px;cursor:pointer;font:inherit}
nav.tabs button[aria-selected=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card.edit{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid .wide{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.ttl{font-weight:700;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0}
.chip{font-size:12px;border-radius:99px;padding:1px 9px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.orange{background:var(--warn-soft);color:var(--orange)}
.chip.green{background:var(--teal-soft);color:var(--green)}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:10px 0}
.tile{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--radius);padding:12px;cursor:pointer;font:inherit}
.tile[aria-pressed=true]{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.tile b{display:block;font-size:26px;line-height:1.2}
.tile span{font-size:13px;color:var(--muted)}
.sec{border-left:4px solid var(--teal);padding:2px 0 2px 12px;margin:12px 0}
.sec.blue{border-color:var(--blue)} .sec.green{border-color:var(--green)} .sec.orange{border-color:var(--orange)} .sec.purple{border-color:var(--purple)}
.sec h3{margin-bottom:4px}
.sec ul,.sec ol{margin:4px 0;padding-left:20px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.scroll{overflow-x:auto}
.check{list-style:none;padding:0;margin:0}
.check li{padding:4px 0;border-top:1px solid var(--line)}
.ok{color:var(--green);font-weight:700} .bad{color:var(--red);font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;max-width:90vw;z-index:20;display:none}
#toast.bad{background:var(--red);color:#fff}
.banner-err{background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:var(--radius);padding:10px 14px;margin:10px 0}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="badge">과제 6</span>
      <h1>플랜두씨 다이어리 1<br><span class="muted" style="font-size:17px;font-weight:600">내 계획과 실제를 담는 앱</span></h1>
      <p class="muted small">계획(Plan) → 실제로 한 일(Do) → 돌아보기(See). 자료는 서버 데이터베이스에 저장되어 새로고침해도 그대로 남습니다.</p>
    </div>
    <div class="row"><div class="badge" id="status">서버 확인 중…</div><button class="btn sm ghost" id="exportBtn" type="button">내 자료 내보내기</button></div>
  </header>

  <div class="notice" id="notice" role="note">지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요</div>
  <div id="fatal"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ 도우미: 모든 글자는 textContent로만 화면에 넣는다(스크립트 모양 글자도 그대로 보임) ============ */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  let value;
  for (const [k, v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") value = v;
    else if (k === "disabled" || k === "checked" || k === "hidden") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  if (value !== undefined) el.value = value;
  return el;
}
const $ = (s, r = document) => r.querySelector(s);
let toastTimer;
function toast(msg, bad){
  const t = $("#toast"); t.textContent = msg; t.className = bad ? "bad" : ""; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 3800);
}
/* ============ 설정: Supabase 프로젝트 값 (README 참고) ============
   SUPABASE_KEY에는 '공개용(publishable)' 키만 넣습니다. 관리자용 비밀 키는 절대 넣지 마세요. */
const SUPABASE_URL = "https://gwxllisihhugupgyanys.supabase.co";
const SUPABASE_KEY = "sb_publishable_7fSv7GCweipfU7kWKb-DLQ_FMVbtJ59";

/* ===== DATA ENGINE START ===== 화면이 Supabase(서버 DB)를 직접 부릅니다.
   완료·집계·거르기·정렬·"서울 오늘" 계산은 DB 함수(supabase.sql)가 하고, 여기서는 입력 확인과 호출만 합니다. */
const PUBLIC_NOTICE = "지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다. 남이 봐도 괜찮은 내용만 넣으세요";
const SCHEMA_VERSION = "pds-schema-v2";
class ApiError extends Error { constructor(message){ super(message); } }

const KST_MS = 9 * 3600 * 1000;
const kstParts = ms => new Date(ms + KST_MS).toISOString();               // 서울 시각을 ISO 모양으로
const todayKst = () => kstParts(Date.now()).slice(0, 10);                  // 화면 기본값 용도(집계의 "오늘"은 DB가 계산)
const fmtKst = iso => iso ? kstParts(Date.parse(iso)).slice(0, 16).replace("T", " ") : "—";   // 서울 시각으로 보여 주기
const newId = prefix => prefix + "-" + crypto.randomUUID().replace(/-/g, "").slice(0, 8);

function vText(d, key, max, required = true){
  let v = d[key] ?? "";
  if (typeof v !== "string") throw new ApiError(key + "는 글자여야 합니다.");
  v = v.trim();
  if (required && !v) throw new ApiError(key + "를 입력하세요.");
  if ([...v].length > max) throw new ApiError(key + "는 " + max + "자 이하여야 합니다.");
  return v;
}
function vDate(d, key, required = true){
  const v = d[key];
  if (v === undefined || v === null || v === ""){
    if (required) throw new ApiError(key + "(날짜)를 입력하세요.");
    return null;
  }
  const ok = typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && new Date(v + "T00:00:00Z").toISOString().slice(0, 10) === v;
  if (!ok) throw new ApiError(key + "는 YYYY-MM-DD 형식의 날짜여야 합니다.");
  return v;
}
function vInt(d, key, lo, hi, required = true){
  const v = d[key];
  if (v === undefined || v === null || v === ""){
    if (required) throw new ApiError(key + "를 입력하세요.");
    return null;
  }
  const n = Number(v);
  if (typeof v === "boolean" || !Number.isInteger(n)) throw new ApiError(key + "는 숫자여야 합니다.");
  if (n < lo || n > hi) throw new ApiError(key + "는 " + lo + "~" + hi + " 사이여야 합니다.");
  return n;
}
function vTags(raw){
  const out = [];
  for (let t of Array.isArray(raw) ? raw : String(raw ?? "").split(",")){
    t = String(t).trim().toLowerCase();
    if (!t) continue;
    if ([...t].length > 20) throw new ApiError("태그는 20자 이하여야 합니다.");
    if (!out.includes(t)) out.push(t);
  }
  if (out.length > 10) throw new ApiError("태그는 10개까지 넣을 수 있습니다.");
  return out;
}
// 서울 시각 입력(예: 2026-11-03T21:00 또는 ...+09:00) → DB로 보낼 ISO
function vDateTime(d, key){
  const v = d[key];
  if (v === undefined || v === null || v === "") return null;
  const ms = typeof v === "string" ? Date.parse(/(Z|[+-]\d\d:\d\d)$/.test(v) ? v : v + "+09:00") : NaN;
  if (Number.isNaN(ms)) throw new ApiError(key + "는 날짜와 시각 형식이어야 합니다.");
  return new Date(ms).toISOString();
}

/* ----- Supabase REST (PostgREST) ----- */
async function sb(method, path, { query = "", body, prefer = "return=representation" } = {}){
  if (/YOUR-PROJECT/.test(SUPABASE_URL) || /YOUR-/.test(SUPABASE_KEY))
    throw new Error("index.html 위쪽의 SUPABASE_URL과 SUPABASE_KEY를 채워 주세요.");
  let res;
  try {
    res = await fetch(SUPABASE_URL + "/rest/v1/" + path + (query ? "?" + query : ""), {
      method, headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: prefer },
      body: body === undefined ? undefined : JSON.stringify(body) });
  } catch (e) { throw new Error("데이터베이스(Supabase)에 연결할 수 없습니다."); }
  if (!res.ok){
    const e = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 403) throw new Error("DB 접근이 거부되었습니다. supabase.sql의 정책(RLS)이 적용됐는지 확인하세요.");
    if (res.status === 404 && /relation|function|rest\/v1/.test(JSON.stringify(e) + path)) throw new Error("DB 표·함수를 찾을 수 없습니다. supabase.sql을 실행했는지 확인하세요.");
    if (e.code === "23503") throw new Error("선택한 계획 또는 할 일이 없습니다.");
    throw new Error(e.message || "DB 요청 실패 (" + res.status + ")");
  }
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}
const rpc = (fn, args = {}) => sb("POST", "rpc/" + fn, { body: args });
const eq = v => "eq." + encodeURIComponent(v);
async function oneTodo(id){
  const r = await rpc("todo_list", { p_todo_id: id });
  if (!r.length) throw new ApiError("할 일을 찾을 수 없습니다.");
  return r[0];
}

/* ----- 라우트 ----- */
const ROUTES = [];
const route = (method, pattern, fn) => ROUTES.push([method, new RegExp("^" + pattern + "$"), fn]);

route("GET", "/meta", async () => ({ ...(await rpc("app_meta")), schema_version: SCHEMA_VERSION, public_notice: PUBLIC_NOTICE }));

async function exportData(){
  const [plans, plan_history, todos, exec_logs, reviews] = await Promise.all(
    ["plans", "plan_history", "todos", "exec_logs", "reviews"].map(t => sb("GET", t, { query: "select=*&order=" + (t === "reviews" ? "plan_id" : t === "plan_history" ? "id" : "seq") + ".asc" })));
  return { schema_version: SCHEMA_VERSION, exported_at: new Date().toISOString(), timezone: "저장은 UTC(timestamptz), 화면 표시는 Asia/Seoul",
    plans, plan_history, todos, exec_logs, reviews };
}

// 계획
route("GET", "/plans", async () => ({ items: await sb("GET", "plans", { query: "select=*&order=priority.asc,start_date.asc,seq.asc" }) }));
function planFields(b){
  const start = vDate(b, "start_date"), end = vDate(b, "end_date");
  if (end < start) throw new ApiError("끝나는 날은 시작하는 날보다 같거나 뒤여야 합니다.");
  return { title: vText(b, "title", 200), category: vText(b, "category", 30), start_date: start, end_date: end,
    priority: vInt(b, "priority", 1, 3), success_criteria: vText(b, "success_criteria", 500), estimated_minutes: vInt(b, "estimated_minutes", 0, 100000) };
}
route("POST", "/plans", async c => ({ item: (await sb("POST", "plans", { body: { id: newId("P"), ...planFields(c.body) } }))[0] }));
route("PUT", "/plans/([\\w-]+)", async (c, id) => {   // 예전 값은 DB 트리거가 plan_history에 남깁니다
  const r = await sb("PATCH", "plans", { query: "id=" + eq(id), body: planFields(c.body) });
  if (!r.length) throw new ApiError("계획을 찾을 수 없습니다.");
  return { item: r[0] };
});
route("DELETE", "/plans/([\\w-]+)", async (c, id) => {
  if (!(await sb("DELETE", "plans", { query: "id=" + eq(id) })).length) throw new ApiError("계획을 찾을 수 없습니다.");
  return { ok: true };   // 할 일·기록·이력은 DB가 함께 지움(ON DELETE CASCADE)
});
route("GET", "/plans/([\\w-]+)/history", async (c, id) => ({ items: await sb("GET", "plan_history", { query: "select=*&plan_id=" + eq(id) + "&order=id.desc" }) }));
route("PUT", "/plans/([\\w-]+)/carry", async (c, id) => {
  const text = vText(c.body, "text", 200, false);
  await sb("POST", "reviews", { query: "on_conflict=plan_id", body: { plan_id: id, carry_text: text, updated_at: new Date().toISOString() }, prefer: "resolution=merge-duplicates,return=minimal" });
  return { ok: true, carry_text: text };
});

// 할 일 (거르기·검색·정렬은 DB의 todo_list 함수가 합니다)
const SORTS = { deadline: "마감일", priority: "우선순위", estimate: "예상 시간", created: "만든 순서", title: "제목" };
route("GET", "/todos", async c => {
  const q = k => c.query.get(k) || "";
  const sort = SORTS[q("sort")] ? q("sort") : "deadline", dir = q("dir") === "desc" ? "desc" : "asc";
  const items = await rpc("todo_list", { p_plan_id: q("plan_id") || null, p_status: q("status") || null,
    p_priority: q("priority") ? Number(q("priority")) : null, p_tag: q("tag") || null, p_q: q("q") || null,
    p_delayed: q("delayed") === "1", p_sort: sort, p_dir: dir });
  let desc = SORTS[sort] + " " + (dir === "desc" ? "내림차순" : "오름차순");
  desc += sort !== "created" ? " · 같은 값이면 우선순위(높은 순) → 만든 순서" : " · 같은 값이 없으므로 만든 순서 그대로";
  if (sort === "deadline" || sort === "estimate") desc += " · 값이 비어 있는 할 일은 항상 맨 뒤";
  return { items, sort, dir, sort_description: desc + " · 거르기와 정렬은 DB에서 처리" };
});
function todoFields(b){
  return { plan_id: vText(b, "plan_id", 40), title: vText(b, "title", 200), deadline: vDate(b, "deadline", false), priority: vInt(b, "priority", 1, 3),
    tags: vTags(b.tags), estimated_minutes: vInt(b, "estimated_minutes", 0, 100000, false) };
}
route("POST", "/todos", async c => {
  const id = newId("T");
  await sb("POST", "todos", { body: { id, ...todoFields(c.body) }, prefer: "return=minimal" });
  return { item: await oneTodo(id) };
});
route("PUT", "/todos/([\\w-]+)", async (c, id) => {
  const f = todoFields(c.body), status = c.body.status;
  if (status !== undefined && !["todo", "doing"].includes(status)) throw new ApiError("진행 상태는 '할 일' 또는 '진행 중'만 직접 바꿀 수 있습니다.");
  const body = status === undefined ? f : { ...f, status };   // 완료·되돌리기는 DB 트리거가 전용 기능으로만 허용
  if (!(await sb("PATCH", "todos", { query: "id=" + eq(id), body, prefer: "return=representation" })).length) throw new ApiError("할 일을 찾을 수 없습니다.");
  return { item: await oneTodo(id) };
});
route("DELETE", "/todos/([\\w-]+)", async (c, id) => {
  if (!(await sb("DELETE", "todos", { query: "id=" + eq(id) })).length) throw new ApiError("할 일을 찾을 수 없습니다.");
  return { ok: true };
});

function idemKey(c, fallback){
  const key = String(c.headers["Idempotency-Key"] || c.body.idempotency_key || "").trim();
  if (key.length > 100) throw new ApiError("Idempotency-Key가 너무 깁니다.");
  return key || fallback;
}
function logArgs(b){
  const s = vDateTime(b, "started_at"), e = vDateTime(b, "ended_at");
  if (s && e && Date.parse(e) < Date.parse(s)) throw new ApiError("끝난 시각은 시작 시각보다 같거나 뒤여야 합니다.");
  return { p_started: s, p_ended: e, p_actual: vInt(b, "actual_minutes", 0, 100000, false), p_blocked: vText(b, "blocked_reason", 300, false) };
}
// 완료는 할 일당 한 번만 기록됩니다(DB 함수 complete_todo + 유일 인덱스).
route("POST", "/todos/([\\w-]+)/complete", async (c, id) => {
  const r = await rpc("complete_todo", { p_todo_id: id, p_key: idemKey(c, null), ...logArgs(c.body) });
  return { duplicate: r.duplicate, log: r.log, item: await oneTodo(id) };
});
route("POST", "/todos/([\\w-]+)/reopen", async (c, id) => {
  await rpc("reopen_todo", { p_todo_id: id });
  return { item: await oneTodo(id) };
});

// 실행 기록
route("GET", "/logs", async c => {
  const rows = await sb("GET", "exec_logs", { query: "select=*,todos(title,plan_id)&order=seq.desc" + (c.query.get("todo_id") ? "&todo_id=" + eq(c.query.get("todo_id")) : "") });
  return { items: rows.map(({ todos, ...l }) => ({ ...l, todo_title: todos && todos.title, plan_id: todos && todos.plan_id })) };
});
route("POST", "/logs", async c => {
  const key = idemKey(c, "");
  if (!key) throw new ApiError("Idempotency-Key(또는 idempotency_key)가 필요합니다.");
  const r = await rpc("add_log", { p_todo_id: vText(c.body, "todo_id", 40), p_key: key, ...logArgs(c.body) });
  return { duplicate: r.duplicate, log: r.log };
});
route("DELETE", "/logs/([\\w-]+)", async (c, id) => {
  const r = (await sb("GET", "exec_logs", { query: "select=id,is_completion&id=" + eq(id) }))[0];
  if (!r) throw new ApiError("기록을 찾을 수 없습니다.");
  if (r.is_completion) throw new ApiError("완료 기록은 지울 수 없습니다. 할 일을 되돌린 뒤 지우세요.");
  await sb("DELETE", "exec_logs", { query: "id=" + eq(id), prefer: "return=minimal" });
  return { ok: true };
});

// 돌아보기 (집계는 DB 함수)
const reviewArgs = c => ({ p_plan_id: c.query.get("plan_id") || null, p_from: c.query.get("from") ? vDate({ from: c.query.get("from") }, "from") : null,
  p_to: c.query.get("to") ? vDate({ to: c.query.get("to") }, "to") : null });
route("GET", "/review", async c => rpc("review_summary", reviewArgs(c)));
route("GET", "/review/records", async c => rpc("review_records", { p_metric: c.query.get("metric") || "", ...reviewArgs(c) }));
route("GET", "/review/periods", async c => { const a = reviewArgs(c); return { items: await rpc("review_by_period", { p_from: a.p_from, p_to: a.p_to }) }; });

// 화면에서 쓰는 호출 창구: api("GET", "/api/todos?sort=priority")
async function api(method, path, body, headers = {}){
  const url = new URL(path, "http://local"), p = url.pathname.replace(/^\/api/, "") || "/";
  for (const [m, rx, fn] of ROUTES){
    const match = rx.exec(p);
    if (m !== method || !match) continue;
    return fn({ query: url.searchParams, body: body || {}, headers }, ...match.slice(1));
  }
  throw new Error("없는 주소입니다.");
}

const dt = fmtKst;                                           // DB의 시각(UTC)을 서울 시간으로 보여 줌
const toKst = local => local ? local + ":00+09:00" : "";   // datetime-local 입력 → 서울 시각

function field(label, input, cls){ return h("div", { class: cls || "" }, h("label", {}, label), input); }

    const logs = (await api("GET", "/api/logs?todo_id=" + t.id)).items;
    listBox.replaceChildren(...(logs.length ? logs.map(l => h("div", { class: "item" },
      h("div", { class: "chips" }, l.is_completion ? h("span", { class: "chip green" }, "완료 기록") : h("span", { class: "chip" }, "실행 기록"), h("span", { class: "chip" }, l.id)),
      h("div", { class: "small" }, "시작 " + dt(l.started_at) + " · 끝 " + dt(l.ended_at) + " · 걸린 시간 " + min(l.actual_minutes)),
      l.blocked_reason ? h("div", { class: "small" }, "막힌 이유: " + l.blocked_reason) : null,
      l.is_completion ? null : h("button", { class: "btn sm danger", onclick: () => guard(async () => { await api("DELETE", "/api/logs/" + l.id); refresh(); }) }, "지우기")))
      : [h("p", { class: "muted" }, "이 할 일의 실행 기록이 아직 없습니다.")]));
  }
  sel.onchange = refresh;
  const save = h("button", { class: "btn", type: "submit" }, "실행 기록 저장");
  v.append(h("form", { class: "card", onsubmit: ev => { ev.preventDefault(); guard(async () => {
      save.disabled = true;
      try {
        const r = await api("POST", "/api/logs", { todo_id: sel.value, started_at: toKst(f.s.value) || null, ended_at: toKst(f.e.value) || null,
          actual_minutes: f.a.value === "" ? null : +f.a.value, blocked_reason: f.b.value }, { "Idempotency-Key": key });
        toast(r.duplicate ? "같은 요청이라 기록은 1건만 남았습니다." : "실행 기록을 저장했습니다.");
        key = uid(); ev.target.reset(); await refresh();
      } finally { save.disabled = false; }
    }); } },
    h("h2", {}, "실제로 한 일 적기"),
    h("p", { class: "muted small" }, "계획과 별개로, 언제 시작해서 얼마나 걸렸고 어디서 막혔는지를 남깁니다. 시각은 서울 시간입니다."),
    h("div", { class: "grid" }, field("어느 할 일", sel, "wide"), field("시작 시각", f.s), field("끝 시각", f.e), field("실제 걸린 시간(분)", f.a), field("막혔던 이유", f.b, "wide")),
    planBox, h("div", { class: "row end" }, save)));
  v.append(h("div", { class: "card" }, h("h2", {}, "이 할 일의 기록"), listBox));
  refresh();
}

/* ============ 카드 4 — 돌아보기 ============ */
const METRICS = [["todo", "계획한 일", r => r.todo_count + "개"], ["done", "완료", r => r.done_count + "개"], ["delayed", "지연", r => r.delayed_count + "개"],
  ["blocked", "막힘", r => r.blocked_count + "개"], ["estimate", "예상 시간 합계", r => min(r.estimated_minutes)], ["actual", "실제 시간 합계", r => min(r.actual_minutes)]];
async function viewReview(v){
  const R = S.review, planSel = planSelect(S.planId, true);
  const from = h("input", { type: "date", value: R.from }), to = h("input", { type: "date", value: R.to });
  const body = h("div");
  const apply = () => { S.planId = planSel.value; R.from = from.value; R.to = to.value; draw(); };
  [planSel, from, to].forEach(x => x.onchange = apply);
  v.append(h("div", { class: "card" }, h("h2", {}, "돌아보기"),
    h("p", { class: "muted small" }, "예상과 실제의 차이를 근거 기록과 함께 봅니다. 숫자를 누르면 그 숫자가 나온 기록이 아래에 나옵니다."),
    h("div", { class: "grid" }, field("계획", planSel), field("기간 시작(이 날 이후 끝나는 계획)", from), field("기간 끝(이 날 이전에 시작한 계획)", to))), body);
  async function draw(){
    await guard(async () => {
      const qs = new URLSearchParams(); if (S.planId) qs.set("plan_id", S.planId); if (R.from) qs.set("from", R.from); if (R.to) qs.set("to", R.to);
      const r = await api("GET", "/api/review?" + qs);
      const tiles = h("div", { class: "tiles" }, METRICS.map(([k, label, fn]) =>
        h("button", { class: "tile", "aria-pressed": R.metric === k ? "true" : "false", onclick: () => { R.metric = k; draw(); } }, h("b", {}, fn(r)), h("span", {}, label))),
        h("div", { class: "tile", style: "cursor:default" }, h("b", {}, signed(r.diff_minutes)), h("span", {}, "차이(실제 − 예상)")));
      const drill = h("div"); body.replaceChildren(h("div", { class: "card" }, h("p", { class: "small muted" }, "대상 계획 " + r.plan_count + "개 · 오늘(서울) " + r.today_seoul), tiles,
        h("p", { class: "small muted" }, "지연 = 완료가 아니고 마감일이 서울 오늘보다 앞선 할 일(완료한 할 일은 세지 않음). 막힘 = 막힌 이유가 하나라도 적힌 할 일. 차이는 실제 − 예상이며 아무것도 없으면 0분.")), drill);
      if (R.metric) await drawRecords(drill, qs);
      body.append(await periodCard(), carryCard(r));
    });
  }
  async function drawRecords(box, qs){
    const q2 = new URLSearchParams(qs); q2.set("metric", R.metric);
    const r = await api("GET", "/api/review/records?" + q2);
    const label = METRICS.find(m => m[0] === R.metric)[1];
    const rows = r.items.map(t => h("tr", {}, h("td", {}, t.title), h("td", {}, STATUS[t.status]), h("td", {}, t.deadline || "—"),
      h("td", {}, min(t.estimated_minutes)), h("td", {}, min(t.actual_minutes)), h("td", {}, t.id)));
    box.append(h("div", { class: "card edit" }, h("h3", {}, "'" + label + "' 숫자의 근거 — 할 일 " + r.items.length + "건"),
      h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, ["할 일", "상태", "마감", "예상", "실제", "ID"].map(x => h("th", {}, x)))), h("tbody", {}, rows))),
      r.logs.length ? [h("h3", { style: "margin-top:12px" }, "근거가 된 실행 기록 " + r.logs.length + "건"),
        h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, ["할 일", "시작", "끝", "걸린 시간", "막힌 이유", "기록 ID"].map(x => h("th", {}, x)))),
          h("tbody", {}, r.logs.map(l => h("tr", {}, h("td", {}, l.todo_title), h("td", {}, dt(l.started_at)), h("td", {}, dt(l.ended_at)), h("td", {}, min(l.actual_minutes)), h("td", {}, l.blocked_reason || "—"), h("td", {}, l.id))))))] : null));
  }
  async function periodCard(){   // 기간(계획)별로 모아 보기
    const qs = new URLSearchParams(); if (R.from) qs.set("from", R.from); if (R.to) qs.set("to", R.to);
    const items = (await api("GET", "/api/review/periods?" + qs)).items;
    const heads = ["기간", "계획", "계획한 일", "완료", "지연", "막힘", "예상", "실제", "차이"];
    return h("div", { class: "card" }, h("h2", {}, "기간별 모아 보기"),
      items.length ? h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, heads.map(x => h("th", {}, x)))),
        h("tbody", {}, items.map(p => h("tr", {}, h("td", {}, p.start_date + " ~ " + p.end_date), h("td", {}, p.title), h("td", {}, p.todo_count), h("td", {}, p.done_count),
          h("td", {}, p.delayed_count), h("td", {}, p.blocked_count), h("td", {}, min(p.estimated_minutes)), h("td", {}, min(p.actual_minutes)), h("td", {}, signed(p.diff_minutes)))))))
        : h("p", { class: "muted" }, "이 기간에 해당하는 계획이 없습니다."));
  }
  function carryCard(r){
    const input = h("input", { maxlength: 200, value: r.carry_text || "", placeholder: "고칠 점 한 가지를 다음 계획으로 넘기기", disabled: r.carry_text === null });
    return h("div", { class: "card" }, h("h2", {}, "다음 계획으로 넘길 한 줄"),
      r.carry_text === null ? h("p", { class: "muted small" }, "위에서 계획을 하나 고르면 적을 수 있습니다.") : null,
      h("div", { class: "row" }, h("div", { style: "flex:1;min-width:220px" }, input),
        h("button", { class: "btn", disabled: r.carry_text === null, onclick: () => guard(async () => { await api("PUT", "/api/plans/" + S.planId + "/carry", { text: input.value }); toast("저장했습니다."); }) }, "저장")));
  }
  draw();
}

$("#exportBtn").onclick = () => guard(async () => {
  const blob = new Blob([JSON.stringify(await exportData(), null, 2)], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "plan-do-see-diary-" + todayKst() + ".json" });
  document.body.append(a); a.click(); a.remove();
});

/* ============ 시작 ============ */
S.tab = (location.hash || "#plan").slice(1);
if (!TABS.some(t => t[0] === S.tab)) S.tab = "plan";
go(S.tab);
</script>
